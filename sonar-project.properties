sonar.issue.ignore.multicriteria.e4.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.e4.resourceKey=**/SystemSnapshot.swift
sonar.issue.ignore.multicriteria.e5.ruleKey=swift:S107
