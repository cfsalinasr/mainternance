sonar.projectKey=cfsalinasr_mainternance
sonar.organization=cfsalinasr
sonar.sources=Sources
sonar.tests=Tests
sonar.exclusions=**/.build/**,**/*.app/**
sonar.sourceEncoding=UTF-8

# Swift coverage: scripts/coverage-to-sonar.sh converts the SwiftPM coverage data to this generic XML.
sonar.coverageReportPaths=coverage.xml
# Verified by build and review rather than unit tests by design: SwiftUI views and drawing helpers
# (no decision logic; any rule lives in the *State/*Model types, which are covered), and the app target,
# which only wires objects together.
sonar.coverage.exclusions=\
  **/*View.swift,\
  **/*Card.swift,\
  **/*Row.swift,\
  **/Design/**,\
  **/Sources/MainternanceApp/**,\
  **/WindowVisibilityObserver.swift,\
  **/HealthBanner.swift,\
  **/DetailsDisclosure.swift,\
  **/FileSearchBar.swift,\
  **/FindingsList.swift,\
  **/MetricTile.swift

# False positives for this project, suppressed per file instead of rewriting the code:
# - swift:S1075 (hard-coded paths): the sample-data files list made-up example paths shown in the
#   design preview; they are display strings, never opened.
# - swift:S107 (too many parameters): SystemSnapshot's memberwise initializer mirrors the ten fields of
#   a plain value type. Same for ScanSummary (ScannerTypes.swift, ten fields) and RecordedScanStatus
#   (ScanStatusRecording.swift, eight fields): plain Domain value types whose initializers mirror their
#   fields with defaults; wrapping them in a parameter struct would only move the same list elsewhere.
# - swift:S1075 (hard-coded paths) in the scanner: these are fixed macOS system locations, not
#   configuration. ProtectedPaths lists the system folders the quarantine must never touch, ScanScopes the
#   standard folders a quick or full scan covers, ToolLocator the two places Homebrew installs tools,
#   and ScannerText the System Settings deep link for Full Disk Access. Making them "customizable" would
#   only let a wrong value weaken a safety check.
# - swift:S1075 (hard-coded paths) in Startup: LaunchItemReader lists the fixed macOS launchd folders
#   (/Library/LaunchAgents, /Library/LaunchDaemons) and LaunchctlCommand runs /bin/launchctl by its absolute path, so
#   nothing on PATH can stand in for it.
# - swift:S1075 (hard-coded paths) in Cleanup: CleanupText shows the fixed Cleanup folders ("~/Library/Caches") as
#   display text only; they are never opened from there (Data's CleanupRoots builds the real paths from the home folder).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13
sonar.issue.ignore.multicriteria.e1.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.e1.resourceKey=**/SampleLists.swift
sonar.issue.ignore.multicriteria.e2.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.e2.resourceKey=**/ScannerSampleState.swift
sonar.issue.ignore.multicriteria.e3.ruleKey=swift:S1075
